name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 tests/py/test_apps.py
      - run: python3 tests/py/test_updates.py
      - run: python3 tests/py/test_desktop.py
      - run: bash tests/sh/test_scripts.sh
      - run: python3 tests/py/test_self.py
      - run: python3 tests/py/test_channel.py
      - run: for f in scripts/*.sh; do bash -n "$f"; done
      - run: pnpm build
      - run: bash scripts/package.sh --dev 1  # el bundle dev debe llevar su propio nombre
